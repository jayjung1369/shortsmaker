services:
  - type: web
    name: shortsmaker-api
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: STRICT_NO_SERVER_PERSIST
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,https://jayjung1369.github.io,https://jayjung1369-gif.github.io"
