services:
  - type: web
    name: shortsmaker-api
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: STRICT_NO_SERVER_PERSIST
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.9"
